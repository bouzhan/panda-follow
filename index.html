<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="telegram-web-app.js"></script>
    <title>Panda Follow</title>
</head>
<body>


<div class="main-menu">
    <img src="icon.png" alt="icon"  class="my-image">
    <h2>نوع فعالیتت رو انتخاب کن</h2>
    <button id="vfv" class="vfv-button">ویو فور ویو ( vfv )</button>
    <button id="vfv" class="jfj-button">جوین فور جوین ( vfv )</button>
    <p class="vfv-description">ویو فور ویو: با دیدن پست بقیه امتیاز کسب کن و پست خودت رو به بقیه نشون بده</p>
    <p class="jfj-description">جوین فور جوین: عضو کانال بقیه شو و امتیاز بدست بیار و ممبر بگیر</p>
</div>


<div class="vfv">

<p id="vfv-view-count" class="view-count">تعداد بازی های فعلی شما: 0 از 100</p>
<p class="vfv-note">برای اینکه کوین بدست بیاری باید 100 تا پست رو ببینی</p>
<button id="vfv-open-post" class="open-post">مشاهده پست بعدی</button>
<img src="icon.png" alt="آیکون" class="my-image">
<p id="vfv-timer-counter" class="timer-counter">10</p>

</div>





<script src ="script.js"></script>  



</body>
</html>
